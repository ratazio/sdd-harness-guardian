contract_version: "1.0.0"
profile: minimal
domain: software

thesis:
  decision_and_audience: >-
    Leadership, architecture, security/operations and an independent
    evaluator decide whether the local-AI exam-scoring boundaries and
    discoveries are safe to move past pre-skeleton review.
  brief_thesis: >-
    Local-AI-assisted correction only stays safe when the flow and its
    uncertainties are intelligible without pretending facts that are not
    yet known.

routes:
  - id: scope
    executive_question: Qual e o fluxo material e onde a incerteza ainda bloqueia?
    blocks:
      - id: hero
        form: prose
        form_reason: >-
          A single business thesis needs no diagram; prose is the most
          direct way to orient the reader on scope and open discovery.
        coverage: represented
        source: spec.md
        source_section: "1. Problem"
        fragment: "Correção local assistida por IA"
        text: >-
          Local-AI-assisted exam correction must serve the request without
          widening scope, hiding uncertainty, or weakening
          security/privacy/operation.

  - id: impact
    blocks:
      - id: surface-security
        collection: impact.surface
        form: footprint
        form_reason: >-
          Impact is a footprint across surfaces (UI, service, data, API,
          auth, build, observability, tests); a card list carries
          risk/evidence per surface better than prose.
        coverage: represented
        source: impact-map.md
        source_section: "2. Affected surfaces"
        fragment: "Auth/security/privacy"
        text: >-
          Access and log boundaries carry high risk and a direct expected
          change, tied to the R-001 regression control.

  - id: decision
    blocks:
      - id: D-005
        form: prose
        form_reason: >-
          A single material sandbox decision is better read as short prose
          than as a matrix.
        coverage: represented
        source: decision-log.md
        source_section: "D-005"
        fragment: "Codex builder"
        text: >-
          The R-001 correction recovers topology, controls, contingencies
          and proof dossiers specific to local-ai-exam-scoring; it does not
          authorize candidate, skeleton, HTML or a gate change until an
          independent reviewer is assigned.

  - id: coverage
    blocks:
      - id: coverage-table
        form: matrix
        form_reason: >-
          The source-to-target coverage table is inherently tabular; a
          matrix preserves the per-source reading the coverage review
          expects.
        coverage: represented
        source: plan.md
        source_section: "9. Brief coverage composition (v2 when applicable)"
        fragment: "brief_coverage_ready: false"
        text: >-
          Every applicable source locator carries a coverage disposition and
          a rendered target; the gate stays false until a distinct
          independent reviewer records findings.
