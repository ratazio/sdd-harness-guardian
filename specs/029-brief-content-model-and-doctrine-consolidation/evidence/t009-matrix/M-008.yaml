contract_version: "1.0.0"
profile: minimal
domain: software

thesis:
  decision_and_audience: >-
    Producer/domain owners, operations, security and an independent
    evaluator decide whether event-derived stock is safe to consult and
    whether recovery may proceed without corrupting the active projection.
  brief_thesis: >-
    Kafka stock events become a consultable, ordered and idempotent
    PostgreSQL balance projection only when Redis stays a read-only cache
    and any replay is bounded, authorized and isolated from the protected
    active projection.

routes:
  - id: scope
    executive_question: Qual e o fluxo material e o que fica fora?
    blocks:
      - id: hero
        form: prose
        form_reason: >-
          A single business thesis needs no diagram; prose is the most
          direct way to orient the reader on scope/anti-scope.
        coverage: represented
        source: spec.md
        source_section: "1. Outcome and boundary"
        fragment: "authorized bounded replay"
        text: >-
          An ordered, idempotent consumer builds a consultable SKU/location
          balance projection; Redis is read-only cache, REST is query/admin
          only, and any replay after an incident runs bounded and isolated
          before promotion, never against the live projection directly.

  - id: impact
    blocks:
      - id: surface-cache
        collection: impact.surface
        form: footprint
        form_reason: >-
          Impact is a footprint across surfaces (consumer, projection,
          cache/REST, replay); a card list carries owner/exposure/control
          per surface better than prose.
        coverage: represented
        source: impact-map.md
        source_section: "1. Boundary and topology"
        fragment: "Redis read cache"
        text: >-
          Redis stays a read cache in front of REST query/admin only; it is
          never the source of truth and never receives writes.

  - id: decision
    blocks:
      - id: D-005
        form: prose
        form_reason: >-
          A single material sandbox decision is better read as short prose
          than as a matrix.
        coverage: represented
        source: decision-log.md
        source_section: "D-005"
        fragment: "event-driven-inventory-recovery"
        text: >-
          The R-001 correction recovers topology, controls, contingencies
          and proof dossiers specific to event-driven-inventory-recovery; it
          does not authorize candidate, skeleton, HTML or a gate change
          until an independent reviewer is assigned.

  - id: coverage
    blocks:
      - id: coverage-table
        form: prose
        form_reason: >-
          This source's coverage section is a short canonical statement,
          not a per-locator table; prose matches the source shape instead
          of inventing table structure that is not there.
        coverage: represented
        source: plan.md
        source_section: "9. Brief coverage composition (v2)"
        fragment: "Coverage remains pre-skeleton and source-only."
        text: >-
          The source inventory and the construction record are both
          canonical in plan.md; section 9.1 is the single deep record a
          composer and reviewer use, and coverage stays pre-skeleton until
          an independent reviewer signs off.
