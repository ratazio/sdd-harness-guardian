contract_version: "1.0.0"
profile: minimal
domain: software

thesis:
  decision_and_audience: >-
    A library visitor, maintenance operator and accessibility/operations
    reviewer decide whether the public search-to-route kiosk journey stays
    equally usable and safe across input modality, network, printer and
    reset conditions.
  brief_thesis: >-
    The kiosk gives a visitor an equivalent, privacy-bounded route from
    title/author search to hours, map/text orientation and a short receipt,
    without hiding accessibility controls or public contingencies behind a
    generic happy path.

routes:
  - id: scope
    executive_question: Qual jornada e essencial e o que fica deliberadamente fora?
    blocks:
      - id: hero
        form: prose
        form_reason: >-
          A single business thesis needs no diagram; prose is the most
          direct way to orient the reader on scope/anti-scope.
        coverage: represented
        source: spec.md
        source_section: "1. Outcome and boundary"
        fragment: "short printed route"
        text: >-
          A visitor searches title or author, gets shelf orientation, hours
          and a short printed route; there is no backend, login, profile
          analytics, location, camera, payment or advertising.

  - id: impact
    blocks:
      - id: surface-accessibility
        collection: impact.surface
        form: footprint
        form_reason: >-
          Impact is a footprint across surfaces (search/route,
          accessibility, public boundary, continuity, contexts); a card
          list carries proof references per surface better than prose.
        coverage: represented
        source: impact-map.md
        source_section: "Boundary and material flow"
        fragment: "keyboard, focus, contrast, targets, scale, AT, motion, language"
        text: >-
          Accessibility is a first-class material surface, not a
          disposition: keyboard operation, visible focus, contrast, touch
          targets, scalable text, assistive-technology support, reduced
          motion and plain language each carry their own FR/AC and
          validation proof.

  - id: decision
    blocks:
      - id: D-005
        form: prose
        form_reason: >-
          A single material sandbox decision is better read as short prose
          than as a matrix.
        coverage: represented
        source: decision-log.md
        source_section: "D-005"
        fragment: "accessible-public-kiosk"
        text: >-
          The R-001 correction recovers topology, controls, contingencies
          and proof dossiers specific to the accessible public kiosk; it
          does not authorize candidate, skeleton, HTML or a gate change
          until an independent reviewer is assigned.

  - id: coverage
    blocks:
      - id: coverage-table
        form: prose
        form_reason: >-
          This source's coverage section is a short canonical statement,
          not a per-locator table; prose matches the source shape instead
          of inventing table structure that is not there.
        coverage: represented
        source: plan.md
        source_section: "9. Brief coverage composition (v2)"
        fragment: "Coverage remains pre-skeleton and source-only."
        text: >-
          The source inventory and the construction record are both
          canonical in plan.md; section 9.1 is the single deep record a
          composer and reviewer use, and coverage stays pre-skeleton until
          an independent reviewer signs off.
