contract_version: "1.0.0"
profile: minimal
domain: software

thesis:
  decision_and_audience: >-
    Leadership, security/operations and an independent evaluator decide
    whether the agentic financial-document reporting pipeline's boundaries
    and discoveries are safe to move past pre-skeleton review.
  brief_thesis: >-
    Financial reports from local documents only stay safe when the agent
    proposes classification but totals, accounting rules and calculations
    remain deterministic, auditable and reviewable by a human on exception.

routes:
  - id: scope
    executive_question: Qual e o fluxo material e onde a incerteza ainda bloqueia?
    blocks:
      - id: hero
        form: prose
        form_reason: >-
          A single business thesis needs no diagram; prose is the most
          direct way to orient the reader on scope and open discovery.
        coverage: represented
        source: spec.md
        source_section: "1. Problem"
        fragment: "Relatórios financeiros de documentos locais"
        text: >-
          Local-document financial reporting must serve the request without
          widening scope, hiding uncertainty, or weakening
          security/privacy/operation; the agent classifies revenue,
          expense and anomaly candidates, but totals and accounting rules
          stay deterministic and auditable, with exceptions routed to human
          review.

  - id: impact
    blocks:
      - id: surface-data
        collection: impact.surface
        form: footprint
        form_reason: >-
          Impact is a footprint across surfaces (UI, service, data, API,
          auth, build, observability, tests); a card list carries
          risk/evidence per surface better than prose.
        coverage: represented
        source: impact-map.md
        source_section: "2. Affected surfaces"
        fragment: "Data/storage"
        text: >-
          State and provenance carry a direct, high-risk expected change
          tied to the R-001 regression control; the source impact table is
          the same generic per-surface shape used across this mock batch,
          not a pipeline-specific breakdown of ingestion, quarantine,
          extraction and agent stages -- a genuine gap, not an invented
          detail (see evidence/T-009.md finding on M-006).

  - id: decision
    blocks:
      - id: D-005
        form: prose
        form_reason: >-
          A single material sandbox decision is better read as short prose
          than as a matrix.
        coverage: represented
        source: decision-log.md
        source_section: "D-005"
        fragment: "agentic-financial-document-reports"
        text: >-
          The R-001 correction recovers topology, controls, contingencies
          and proof dossiers specific to agentic-financial-document-reports;
          it does not authorize candidate, skeleton, HTML or a gate change
          until an independent reviewer is assigned.

  - id: coverage
    blocks:
      - id: coverage-table
        form: matrix
        form_reason: >-
          The source-to-target coverage table is inherently tabular; a
          matrix preserves the per-source reading the coverage review
          expects.
        coverage: represented
        source: plan.md
        source_section: "9. Brief coverage composition (v2 when applicable)"
        fragment: "brief_coverage_ready: false"
        text: >-
          Every applicable source locator carries a coverage disposition and
          a rendered target; the gate stays false until a distinct
          independent reviewer records findings.
