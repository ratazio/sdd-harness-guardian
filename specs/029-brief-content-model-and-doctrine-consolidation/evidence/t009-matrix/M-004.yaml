contract_version: "1.0.0"
profile: minimal
domain: software

thesis:
  decision_and_audience: >-
    Product and mobile-architecture reviewers decide whether the shared
    cross-platform learning-tracking core is complete enough for the next
    review.
  brief_thesis: >-
    Students and guardians get the same weekly-plan journey on iOS, Android
    and web only when the shared domain and its ports stay free of native
    runtime on the web surface.

routes:
  - id: scope
    executive_question: Qual jornada e comum as tres superficies e o que fica fora?
    blocks:
      - id: hero
        form: prose
        form_reason: >-
          A single business thesis needs no diagram; prose is the most
          direct way to orient the reader on scope/anti-scope.
        coverage: represented
        source: spec.md
        source_section: "Outcome, atores e limite"
        fragment: "API GraphQL existente"
        text: >-
          Students and guardians consult the weekly plan and progress,
          complete activities and receive local reminders on iOS, Android
          and web, reading and writing through the existing GraphQL API;
          chat, video, payments and a teacher portal stay out of scope.

  - id: impact
    blocks:
      - id: surface-sync
        collection: impact.surface
        form: footprint
        form_reason: >-
          Impact is a footprint across surfaces (shared domain, iOS/Android
          adapters, web adapter); a card list carries owner/exposure/control
          per surface better than prose.
        coverage: represented
        source: impact-map.md
        source_section: "Topologia e fronteiras"
        fragment: "TanStack Query"
        text: >-
          The shared `@learning/domain` module carries models, queue and
          reconciliation with no runtime; only the native adapters own
          secure storage, SQLite, notifications and background sync.

  - id: decision
    blocks:
      - id: D-005
        form: prose
        form_reason: >-
          A single material sandbox decision is better read as short prose
          than as a matrix.
        coverage: represented
        source: decision-log.md
        source_section: "D-005"
        fragment: "R2-M004-01"
        text: >-
          The earlier claim that no discovery remained was withdrawn:
          Q-001 (the post-conflict action) stays pending, owned by product,
          and continues to block T-003/V-003 until resolved; overwrite and
          automatic retry stay prohibited in the meantime.

  - id: coverage
    blocks:
      - id: coverage-table
        form: matrix
        form_reason: >-
          The source-to-target coverage table is inherently tabular; a
          matrix preserves the per-source reading the coverage review
          expects.
        coverage: represented
        source: plan.md
        source_section: "6. Cobertura de fontes para brief v2"
        fragment: "nenhuma cobertura está aprovada"
        text: >-
          Every applicable source locator is listed with its rendered
          target, and the verdict stays REVISE until an independent,
          distinct reviewer records approval.
